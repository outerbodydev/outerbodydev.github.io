<style>
/* Layout: full-screen low-poly 3D room; HUD pinned to the corners; project drawer slides in from the right (bottom sheet on phones). */
:root{

button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sec);outline-offset:3px}
.btn{min-height:44px;padding:0 18px;display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#2a2f38,#0e1015);border:1px solid #4a5260;border-top-color:#8d97a6;color:var(--ink);letter-spacing:.18em;font-size:12px;text-transform:uppercase;cursor:pointer;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 4px 14px rgba(0,0,0,.5)}

/* intro */
#intro{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transition:opacity .8s}

/* drawer */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);border-left:1px solid #3c4450;box-shadow:-30px 0 60px rgba(0,0,0,.6),inset 1px 0 0 rgba(255,255,255,.08);transform:translateX(102%);transition:transform .55s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:repeating-linear-gradient(45deg,#0d1016 0 8px,#11151c 8px 16px)}

.ph span:last-child{font-size:10px;letter-spacing:.2em;color:var(--dim)}
.tile:hover .thumb{border-color:var(--sec)}
.t-title{font-size:13px;letter-spacing:.06em;color:var(--ink);overflow-wrap:anywhere}
.t-meta{font-size:11px;letter-spacing:.14em;color:var(--dim)}
.contact{display:flex;flex-direction:column;gap:12px}

.links{display:flex;flex-wrap:wrap;gap:10px}
.p-foot{margin-top:auto;padding:14px 24px;border-top:1px solid var(--line);font-size:10px;letter-spacing:.2em;color:var(--dim)}

#muteBtn{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:44px;height:44px;min-height:44px;padding:0;justify-content:center;z-index:5;color:#8dffb4}
#muteBtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 4px currentColor)}

  background:linear-gradient(180deg,rgba(74,255,196,.13),rgba(74,255,196,.04));border:1px solid rgba(74,255,196,.65);box-shadow:0 0 40px rgba(74,255,196,.35),inset 0 0 34px rgba(74,255,196,.16);
  text-shadow:0 0 8px rgba(74,255,196,.8);transform:translate(-50%,-50%) perspective(900px) rotateY(-9deg) scaleY(.02);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));z-index:6}

  transform:translate(-50%,-50%) scaleY(.01);opacity:0;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .25s;z-index:6;color:var(--ink);font-family:var(--f-mono)}

/* video */
.v-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr) 150px;gap:3px;padding:3px}
.v-info{grid-column:1;grid-row:1}.v-bin{grid-column:1;grid-row:2/4}.v-prog{grid-column:2;grid-row:1/3}.v-tl{grid-column:2;grid-row:3}
.v-tl .trk-h,.v-tl .lanes{grid-template-rows:18px repeat(4,minmax(0,1fr))}
.v-prog .mon{flex:1;min-height:0;position:relative;background:#000;display:flex;align-items:center;justify-content:center;padding:10px}
.v-prog .mon .mfr{height:100%;aspect-ratio:16/9;max-width:100%}
.safe{position:absolute;inset:14% 18%;border:1px dashed rgba(255,255,255,.12);pointer-events:none}
.bin{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;align-content:start}
.clip{display:flex;flex-direction:column;gap:4px;padding:4px;background:none;border:1px solid transparent;color:#c9ced6;font:inherit;text-align:left;cursor:pointer}
.clip .mfr{aspect-ratio:16/9}.clip.on,.clip:hover{border-color:#e6ebf2;background:#26282e}
.cn{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cm{font-size:10px;color:#7a828f}
.tl{flex:1;min-height:0;display:grid;grid-template-columns:44px minmax(0,1fr);overflow:hidden}
.trk-h{display:grid;grid-template-rows:20px repeat(4,minmax(0,1fr));background:#1a1b1f;border-right:1px solid #0b0c0f}
.trk-h span{display:flex;align-items:center;justify-content:center;font-size:10px;color:#8a93a3;border-bottom:1px solid #0b0c0f}
.lanes{position:relative;display:grid;grid-template-rows:20px repeat(4,minmax(0,1fr));background:#141518}
.ruler{position:relative;font-size:9px;color:#8a93a3;background:repeating-linear-gradient(90deg,#3a3e46 0 1px,transparent 1px 10%),repeating-linear-gradient(90deg,#2a2d33 0 1px,transparent 1px 2%);background-color:#1a1b1f;border-bottom:1px solid #0b0c0f}
.lane{position:relative;border-bottom:1px solid #0b0c0f;pointer-events:none}
.ruler span{position:absolute;top:3px;transform:translateX(3px);white-space:nowrap}.ruler span:last-child{transform:translateX(calc(-100% - 3px))}
.lanes[data-scrub]{cursor:ew-resize;touch-action:none}.lanes[data-scrub]:focus-visible{outline:1px solid #8d97a6;outline-offset:-1px}
.phd::after{content:"";position:absolute;top:-2px;left:-7px;width:14px;height:14px}
.vol{display:flex;align-items:center;gap:6px;color:#aeb5bf;font-size:10px;font-variant-numeric:tabular-nums}

.vol input{width:96px;accent-color:#e6ebf2}.vol span{width:22px;text-align:right}
.cl{position:absolute;top:3px;bottom:3px;display:flex;align-items:center;padding:0 6px;overflow:hidden;border:1px solid rgba(0,0,0,.6);font:10px var(--f-mono);color:#0b0c0f;white-space:nowrap}
.cl.v{height:calc(100% - 6px);background:linear-gradient(180deg,#9db6e8,#6f8fcc);cursor:pointer}.cl.v span{overflow:hidden;text-overflow:ellipsis}
.cl.v.on{outline:2px solid #fff;outline-offset:-2px}.cl.t{background:#c99ae6}
.cl.a{background:repeating-linear-gradient(90deg,#5fbf88 0 2px,#4aa673 2px 4px)}.cl.a2{opacity:.75}
/* graphic + fashion */
.optbar{flex:none;display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;background:#1c1d22;border-bottom:1px solid #0b0c0f;color:#aeb5bf;font-size:11px;white-space:nowrap;overflow:hidden}
.sw{display:inline-block;width:16px;height:16px;background:#fff;border:1px solid #000}.sw-s{background:none;border:3px solid #e6ebf2;box-shadow:0 0 0 1px #000}

.tl-b{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#c9ced6}.tl-b.on{background:#3a3e46;color:#fff}

.g-canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background:#2b2d33;border:1px solid #0b0c0f;display:flex;align-items:center;justify-content:center;padding:34px 24px 24px 34px}
.rul{position:absolute;background:#1a1b1f}.rul-h{top:0;left:18px;right:0;height:18px;background-image:repeating-linear-gradient(90deg,#4a4e57 0 1px,transparent 1px 40px)}
.rul-v{top:18px;left:0;bottom:0;width:18px;background-image:repeating-linear-gradient(0deg,#4a4e57 0 1px,transparent 1px 40px)}
.ab-wrap{position:relative;height:100%;max-width:100%;aspect-ratio:4/5;display:flex}
.ab-name{position:absolute;top:-18px;left:0;font-size:10px;color:#aeb5bf;white-space:nowrap}
.artboard{flex:1;box-shadow:0 6px 24px rgba(0,0,0,.5);background:#f2f2f2}
.artboard img{object-fit:contain!important;background:#0d0e11}
.app-crt .ab-wrap{aspect-ratio:auto;width:100%}
.g-side{display:flex;flex-direction:column;gap:3px;min-height:0;overflow:auto}
.g-side .pnl{flex:none}.g-side .pnl:nth-child(2){flex:1;min-height:180px}
.alist{display:flex;flex-direction:column;max-height:220px;overflow:auto}
.ai{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:6px 10px;background:none;border:0;border-bottom:1px solid #141518;color:#c9ced6;font:inherit;text-align:left;cursor:pointer}
.ai .mfr{height:34px}.ai b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ai i{font-style:normal;font-size:10px;color:#7a828f}
.ai.on,.ai:hover{background:#2f3239}.ai.on b{color:#fff}
.layers{display:flex;flex-direction:column}.layers span{padding:6px 10px;border-bottom:1px solid #141518;color:#aeb5bf}
.f-board{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid #0b0c0f;color:#d6d9de;background-color:#3a3836;background-image:radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.6px),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.4px),radial-gradient(rgba(0,0,0,.22) 1.5px,transparent 2.2px);background-size:7px 7px,11px 11px,17px 17px;background-position:0 0,3px 5px,8px 2px;box-shadow:inset 0 0 60px rgba(0,0,0,.55)}
.f-bh{flex:none;display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid #26252a;background:#2a292c;font-size:11px;color:#c9ced6}.f-bh b{font-weight:700}
.mood{flex:1;min-height:0;overflow:auto;padding:22px;display:flex;flex-wrap:wrap;gap:24px;align-content:flex-start;justify-content:center}
.pol{position:relative;margin:0;width:min(200px,42%);padding:10px 10px 0;background:#d8d5ce;box-shadow:0 10px 22px rgba(0,0,0,.55);transform:rotate(var(--r));color:#1d1d26}
.pol::before,.snote::before{content:"";position:absolute;top:-7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;z-index:1;background:radial-gradient(circle at 34% 30%,#ffffff 0 14%,#cfd6df 26%,#7d858f 62%,#3a3f47 100%);box-shadow:0 3px 4px rgba(0,0,0,.6),inset 0 -1px 2px rgba(0,0,0,.4)}
.pol::after,.snote::after{content:"";position:absolute;top:6px;left:50%;width:6px;height:6px;margin-left:-1px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(1px)}
.pol .mfr{aspect-ratio:1}.pol figcaption{padding:8px 2px 10px;font:700 18px Caveat,cursive;text-align:center}
.snote{position:relative;width:min(220px,44%);padding:20px 16px 16px;background:#c9b65a;box-shadow:0 10px 20px rgba(0,0,0,.5);transform:rotate(var(--r));font:20px/1.25 Caveat,cursive;color:#1d1d26}
.snote p{margin:0 0 6px}.snote .hint{color:#5a5030}
.nl{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:#e6ebf2}
.sws{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px}.sws i{aspect-ratio:1;border:1px solid #000}
/* music */
.m-trans{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:#1c1d22;border-bottom:1px solid #0b0c0f;overflow-x:auto}
.rec{color:#ff3b5c;padding:0 4px}
.lcd{display:flex;flex-direction:column;align-items:center;padding:2px 10px;background:#0f1a12;border:1px solid #000;box-shadow:inset 0 0 8px rgba(0,0,0,.7)}
.lcd b{font:14px var(--f-mono);color:#9dffb0;font-variant-numeric:tabular-nums}.lcd i{font-style:normal;font-size:8px;letter-spacing:.2em;color:#4f8a5c}
.m-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,290px);gap:3px;padding:3px}
.m-arr{min-width:0;min-height:0;display:flex;flex-direction:column;background:#141518;border:1px solid #0b0c0f;overflow:hidden}
.m-ruler{flex:none;display:grid;grid-template-columns:150px repeat(16,minmax(0,1fr));height:20px;background:#1a1b1f;border-bottom:1px solid #0b0c0f;font-size:10px;color:#7a828f}
.m-ruler span{padding-left:3px;border-left:1px solid #2a2d33}.m-ruler span:first-child{grid-column:2}
.m-tracks{position:relative;flex:1;overflow:auto}
.m-row{display:grid;grid-template-columns:150px minmax(0,1fr);height:62px;border-bottom:1px solid #0b0c0f}
.m-hd{height:100%;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 10px;background:#1e2025;border:0;border-right:1px solid #0b0c0f;color:#c9ced6;font:inherit;text-align:left;cursor:pointer;position:relative}
.m-hd b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m-hd i{font-style:normal;font-size:10px;color:#7a828f}.m-hd span{position:absolute;right:8px;top:6px;font-size:9px;color:#6b7380}
.m-row.on .m-hd{background:#2f3239;color:#fff}
.m-lane{position:relative;height:62px;background:repeating-linear-gradient(90deg,#1d1f23 0 1px,transparent 1px 6.25%)}
.m-reg{padding-left:12px!important;position:absolute;top:6px;height:50px;box-sizing:border-box;line-height:1.2;padding:3px 6px;display:flex;align-items:flex-start;background:linear-gradient(180deg,rgba(255,59,92,.55),rgba(255,59,92,.3)),repeating-linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.25) 3px 4px);border:1px solid #ff3b5c;color:#fff;font:10px var(--f-mono);overflow:hidden;white-space:nowrap;cursor:pointer}
.m-row.on .m-reg{outline:2px solid #fff;outline-offset:-2px}
.m-tracks{--hw:150px}
.m-tracks .m-row{gap:0;padding:0;align-items:stretch;min-height:0;font-size:inherit;color:inherit;text-decoration:none}
.m-phw{position:absolute;top:0;bottom:0;left:var(--hw);right:0;pointer-events:none;overflow:visible;clip-path:inset(-4px -12px 0 0);z-index:2}
.m-phw .phd{margin-left:0}.m-phw .phd::before{left:-4px}
.m-row:not(.on) .m-reg{filter:grayscale(1);opacity:.32}
.m-row:not(.on) .m-hd b,.m-row:not(.on) .m-hd i{opacity:.45}
.m-row:not(.on) .m-lane{opacity:.6}
.cover{aspect-ratio:1}
/* audio */
.a-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(190px,240px) minmax(0,1fr) minmax(210px,270px);gap:3px;padding:3px}
.flist{flex:1;overflow:auto}
.fi{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;padding:8px 10px;background:none;border:0;border-bottom:1px solid #141518;color:#c9ced6;font:inherit;text-align:left;cursor:pointer}
.fi svg{width:20px;height:20px;fill:none;stroke:#7fd0ff;stroke-width:1.6}.fi b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fi i{font-style:normal;font-size:10px;color:#7a828f}
.fi.on,.fi:hover{background:#2f3239}
.wv{position:relative;flex:1;min-height:140px}.wv canvas{position:absolute;inset:0;width:100%;height:100%}
/* about */
.n-grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,260px);gap:3px;padding:3px}

.portrait{aspect-ratio:4/5}
/* contact */
.c-grid{flex:1;min-height:0;display:grid;grid-template-columns:170px minmax(0,1fr);gap:3px;padding:3px}
.c-folders{display:flex;flex-direction:column;background:#1e2025;border:1px solid #0b0c0f}.c-folders span{padding:10px 14px;color:#8a93a3;border-bottom:1px solid #141518}.c-folders .on{color:#fff;background:#2f3239}
.c-form{min-width:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:#1e2025;border:1px solid #0b0c0f}

.c-row input{grid-column:2/4}
.c-form textarea{min-height:180px;resize:vertical;line-height:1.6}

}

const clock=new THREE.Clock(); let screenT=0, flickerT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(LITE){ if(now-(frame._l||0)<31) return; frame._l=now; }
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  for(let n=tweens.length-1;n>=0;n--){ const tw=tweens[n]; const p=(now-tw.t0)/tw.dur; if(p<0) continue; const e=ease(Math.min(1,p)); tw.fn(e); if(p>=1){ tweens.splice(n,1); tw.done&&tw.done(); } }

  if(mode==='intro'){ camPos.set(0,0,introDist); camLook.set(0,0,0);
    const m=reduce?0:1; handheld.rotation.y+=((ptr.x*.35-.12+Math.sin(t*.4)*.06*m)-handheld.rotation.y)*Math.min(1,dt*3);

  if(mode==='room'){ if(!down){ const st=2*Math.PI/N, d=Math.round(yawT/st)*st-yawT; if(Math.abs(d)<.4) yawT+=d*Math.min(1,dt*1.8); }

    camPos.set(0,EYE+(reduce?0:Math.sin(t*1.1)*.02),0); camLook.copy(camPos).add(dirOf(yaw,pitch));

  camera.position.copy(camPos); camera.lookAt(camLook); camera.updateMatrixWorld(); if(world==='room') SND.listen(camera);
  if(shake>0){ camera.position.x+=(Math.random()-.5)*.04*shake; camera.position.y+=(Math.random()-.5)*.04*shake; }

  if(world==='console'){
    if(cs==='web') return;
    if(cs==='idle') pressMesh.material.opacity=(t*1.6|0)%2?1:.3;
    logo.rotation.y+=dt*(hoverLogo&&mode==='intro'&&cs==='idle'?2.2:1); logo.rotation.x=Math.sin(t*.7)*.18; logoRing.rotation.z+=dt*.5;
    scr.scan.position.y=1.6-((t*.5)%1)*3.2;
    bumpers.forEach((b,n)=>{ b.material.opacity=.2+Math.sin(t*2+n)*.1+(hoverLogo?.25:0); });

    renderer.render(cScene,camera);
    if((t*4|0)!==frame._c){ frame._c=t*4|0; $('clock').textContent=new Date().toTimeString().slice(0,8)+' · JST+'; }

  // sectors
  const fNear=nearest(), isNear=s=>focused===s||Math.min(Math.abs(s.i-fNear),N-Math.abs(s.i-fNear))<=1;

    if(s.char){ const C=s.char; C.body.scale.y=1+Math.sin(t*1.7)*.006; const cp=C.fig.worldToLocal(camera.position.clone()); const want=Math.max(-.6,Math.min(.6,Math.atan2(cp.x,cp.z)));
      C.head.rotation.y+=(want-C.head.rotation.y)*Math.min(1,dt*2); C.head.rotation.x=.08+Math.sin(t*.6)*.025; C.head.rotation.z=.16+Math.sin(t*.4)*.02; C.fig.rotation.y=Math.sin(t*.35)*.02; }
    if(s.video&&near) drawMonitor(s,t);
    if(s.book) bookUpdate(s.book,performance.now());

    if(s.audio&&near) audioUpdate(s,t,dt);
    if(s.music){ if(near) drawLaptop(s,t); const lv=SND.ambLevel(); s.music.woofers.forEach((w,n)=>{ const k=1+lv*(n%2?.25:.1); w.scale.set(k,1,k); }); }

    s.light.intensity=(s.lightBase!=null?s.lightBase:(s.char?1.3:2.4))+s.hover*(s.lightHover!=null?s.lightHover:(s.char?.8:1.8)); s.cone.material.opacity=.07+s.hover*.05;
    const P=s.obj.userData.parts;
    if(P.bars) P.bars.forEach((b,n)=>{ const v=.25+Math.abs(Math.sin(t*(2+n*.7)+n))*(.8+s.hover*.5); b.scale.y=v; b.position.y=-.52+v/2; });
    if(P.rec) P.rec.visible=(t*2|0)%2===0; if(P.tip) P.tip.scale.setScalar(1+Math.sin(t*6)*.4);
    if(P.orb) P.orb.position.set(Math.cos(t*2)*.55,Math.sin(t*2)*.35,.15); if(P.cage) P.cage.rotation.x+=dt*.4; });

/* ===== sound: all synthesized with Web Audio, starts on first click ===== */
const SND={ctx:null,master:null,muted:false,humNodes:null,dreadTimer:null,k:1,
  init(){ if(this.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=this.ctx=new AC(); this.master=c.createGain(); this.master.gain.value=this.muted?0:.28;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=6; this.master.connect(comp).connect(c.destination);
    // grime bus: waveshaper distortion into a dark filter
    this.dist=c.createWaveShaper(); const n=1024, curve=new Float32Array(n), kk=14; for(let i=0;i<n;i++){ const x=i*2/n-1; curve[i]=(1+kk)*x/(1+kk*Math.abs(x)); } this.dist.curve=curve; this.dist.oversample='2x';
    const dl=c.createBiquadFilter(); dl.type='lowpass'; dl.frequency.value=2600; this.distOut=c.createGain(); this.distOut.gain.value=.3; this.dist.connect(dl).connect(this.distOut).connect(this.master);

    this.echo=c.createDelay(1); this.echo.delayTime.value=.27; const fb=c.createGain(); fb.gain.value=.42; const ef=c.createBiquadFilter(); ef.type='bandpass'; ef.frequency.value=900; ef.Q.value=1.4;
    this.echo.connect(ef).connect(fb).connect(this.echo); const eo=c.createGain(); eo.gain.value=.5; ef.connect(eo).connect(this.master);
    const len=c.sampleRate*2; this.noise=c.createBuffer(1,len,c.sampleRate); const d=this.noise.getChannelData(0); let b=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; b=.97*b+.03*w; d[i]=i%2?w:b*3; } },
  resume(){ this.init(); if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); return !!this.ctx; },
  setMuted(m){ this.muted=m; if(this.master) this.master.gain.setTargetAtTime(m?0:.28,this.ctx.currentTime,.05); },
  route(node,bus){ node.connect(bus==='dist'?this.dist:this.master); if(bus==='echo'||bus==='both'){ const s=this.ctx.createGain(); s.gain.value=.5; node.connect(s).connect(this.echo); } if(bus==='both') node.connect(this.dist); },
  env(g,t,a,peak,dur){ peak*=this.k; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a); g.gain.exponentialRampToValueAtTime(.0001,t+dur); },
  tone(f,dur,type,vol,when,slide,attack,bus){ if(!this.ctx) return; const t=this.ctx.currentTime+(when||0); const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); this.env(g,t,attack||.005,vol,dur); o.connect(g); this.route(g,bus); o.start(t); o.stop(t+dur+.05); },
  hiss(dur,vol,ftype,f0,f1,when,q,attack,bus){ if(!this.ctx) return; const t=this.ctx.currentTime+(when||0); const s=this.ctx.createBufferSource(); s.buffer=this.noise; s.loop=true; s.playbackRate.value=.6+Math.random()*.6;

  thud(when,vol){ this.tone(70,.5,'sine',vol||.6,when,28,.003); this.hiss(.18,(vol||.6)*.4,'lowpass',400,90,when,.7,.003); },
  scrape(when,dur,f0,f1,vol){ this.hiss(dur,vol||.12,'bandpass',f0,f1,when,18,.05,'both'); this.hiss(dur,(vol||.12)*.6,'bandpass',f0*1.47,f1*1.47,when,24,.05,'echo'); },
  hover(){ this.hiss(.05,.05,'bandpass',3200,2600,0,12,.002); this.tone(62,.09,'sine',.12,0,40,.002); },
  tick(){ this.thud(0,.35); this.hiss(.07,.08,'bandpass',1800,900,0,6,.002,'dist'); },
  select(){ [110,116.5,155.6].forEach(f=>this.tone(f,.9,'sawtooth',.07,0,f*.94,.01,'both')); this.thud(0,.5); this.scrape(.05,.7,2400,700,.1); },
  back(){ this.hiss(.35,.12,'bandpass',300,2400,0,3,.3,'dist'); this.thud(.33,.45); this.tone(98,.6,'sawtooth',.05,.33,49,.01,'dist'); },
  buzz(){ if(!this.ctx) return; for(let i=0;i<5;i++){ const w=i*.025+Math.random()*.02; this.tone(50+Math.random()*10,.03,'square',.02,w,0,.001); this.hiss(.02,.03,'highpass',3000,5000,w,1,.001); } },
  // ===== ambient song from the music desk speakers (3D positioned) =====
  ambPos:null, amb:null,
  ambStart(){ if(!this.ctx||this.amb) return; const c=this.ctx, t=c.currentTime;
    const pan=c.createPanner(); pan.panningModel='HRTF'; pan.distanceModel='inverse'; pan.refDistance=1.6; pan.rolloffFactor=1.3; pan.maxDistance=40;
    const p=this.ambPos||{x:0,y:1.2,z:0}; if(pan.positionX){ pan.positionX.value=p.x; pan.positionY.value=p.y; pan.positionZ.value=p.z; } else pan.setPosition(p.x,p.y,p.z);

    if(SITE.ambientTrack){ const el=new Audio(); el.src=SITE.ambientTrack; el.loop=true; el.crossOrigin='anonymous'; const src=c.createMediaElementSource(el); src.connect(bus); el.play().catch(()=>{}); a.el=el; }

  ambTick(){ const a=this.amb, c=this.ctx; if(!a) return; const spb=60/78/4; // 78 bpm, 16th notes
    const prog=[[57,60,64],[53,57,60],[50,53,57],[52,56,59]];
    while(a.next<c.currentTime+.25){ const s=a.step%16, bar=(a.step/16|0)%4, t=a.next, ch=prog[bar];

      if(s===4||s===12) this.ambSnare(t);
      if(s%2===0) this.ambHat(t,s%4===2?.03:.015);
      if(s===0) ch.forEach(n=>this.ambPad(n,t,spb*16));
      if(s===0||s===6||s===11) this.ambNote(ch[0]-24,t,spb*3,'sawtooth',.07,300);
      if(s===14&&bar===3) this.ambNote(ch[2]+12,t,spb*2,'triangle',.03,1800);

  ambOsc(f,t,dur,type,vol,cut,att){ const c=this.ctx, o=c.createOscillator(), g=c.createGain(), lp=c.createBiquadFilter(); o.type=type; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=cut;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(lp).connect(g).connect(this.amb.bus); o.start(t); o.stop(t+dur+.05); return o; },
  ambNote(m,t,dur,type,vol,cut){ this.ambOsc(440*Math.pow(2,(m-69)/12),t,dur,type,vol,cut,.01); },
  ambPad(m,t,dur){ const f=440*Math.pow(2,(m-69)/12); [-7,7].forEach(d=>{ const o=this.ambOsc(f,t,dur,'sawtooth',.018,900,.6); o.detune.value=d; }); },
  ambKick(t){ const c=this.ctx,o=c.createOscillator(),g=c.createGain(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(38,t+.14); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.0001,t+.32); o.connect(g).connect(this.amb.bus); o.start(t); o.stop(t+.35); },
  ambNoise(t,dur,vol,type,f,q){ const c=this.ctx,s=c.createBufferSource(); s.buffer=this.noise; const fl=c.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(fl).connect(g).connect(this.amb.bus); s.start(t,Math.random()); s.stop(t+dur+.02); },
  ambSnare(t){ this.ambNoise(t,.18,.12,'bandpass',1700,1.2); },
  ambHat(t,v){ this.ambNoise(t,.04,v,'highpass',7000,.7); },
  ambStop(){ const a=this.amb; if(!a) return; this.amb=null; const t=this.ctx.currentTime; a.out.gain.cancelScheduledValues(t); a.out.gain.setTargetAtTime(.0001,t,.3); clearInterval(a.timer); if(a.el) setTimeout(()=>a.el.pause(),1500); },
  ambDuck(on){ if(!this.amb) return; const t=this.ctx.currentTime; this.amb.out.gain.cancelScheduledValues(t); this.amb.out.gain.setTargetAtTime(on?.04:.55,t,.4); },
  ambLevel(){ const a=this.amb; if(!a) return 0; a.an.getByteTimeDomainData(a.buf); let m=0; for(let i=0;i<a.buf.length;i+=4){ const v=Math.abs(a.buf[i]-128); if(v>m) m=v; } return Math.min(1,m/40); },
  listen(cam){ if(!this.ctx) return; const L=this.ctx.listener, p=cam.position, f=new THREE.Vector3(); cam.getWorldDirection(f);
    if(L.positionX){ const t=this.ctx.currentTime; L.positionX.setTargetAtTime(p.x,t,.05); L.positionY.setTargetAtTime(p.y,t,.05); L.positionZ.setTargetAtTime(p.z,t,.05); L.forwardX.setTargetAtTime(f.x,t,.05); L.forwardY.setTargetAtTime(f.y,t,.05); L.forwardZ.setTargetAtTime(f.z,t,.05); L.upX.value=0; L.upY.value=1; L.upZ.value=0; }
    else { L.setPosition(p.x,p.y,p.z); L.setOrientation(f.x,f.y,f.z,0,1,0); } },
  sparkle(){ if(!this.resume()) return; this.k=.5; [2093,2637,3136,4186,5274].forEach((f,i)=>this.tone(f,.7,'sine',.05,i*.055,f*1.01,.003)); this.hiss(.6,.05,'highpass',6000,9500,0,.7,.01); this.tone(523,1.2,'triangle',.03,.02,520,.01); this.k=1; },
  flip(){ if(!this.resume()) return; this.k=.55; this.hiss(.26,.18,'bandpass',1500,4200,0,1.2,.05); this.hiss(.1,.1,'highpass',2500,5000,.14,.7,.01); this.k=1; },
  hinge(){ if(!this.resume()) return; this.k=.5; this.scrape(0,.75,620,420,.08); this.thud(.7,.32); this.tone(1650,.25,'triangle',.02,.71,1600,.002); this.k=1; },
  pickup(){ if(!this.resume()) return; this.k=.6; this.hiss(.06,.3,'bandpass',2200,1400,0,4,.002); this.thud(0,.35); this.hiss(1.6,.06,'bandpass',900,1400,.15,2,.4); this.tone(110,1.4,'sine',.05,.2,108,.3); this.tone(113.5,1.4,'sine',.04,.2,111,.3); this.k=1; },
  hangup(){ if(!this.resume()) return; this.k=.6; this.hiss(.05,.3,'bandpass',1800,1200,0,4,.002); this.thud(.02,.4); this.hiss(.03,.15,'highpass',3000,4000,.12,1,.002); this.k=1; },
  heartbeat(when){ this.thud(when,.4); this.thud(when+.22,.28); },

    [55,58.27,77.78,110.4].forEach((f,i)=>{ const o=c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f,t+.2); o.frequency.exponentialRampToValueAtTime(f*1.5,t+2.15); o.detune.value=(i-1.5)*9; o.connect(lp); o.start(t+.2); o.stop(t+2.25); });
    this.hiss(1.95,.2,'bandpass',600,4200,.25,1.2,1.6,'dist');
    this.hiss(.9,.16,'highpass',800,6000,1.3,.7,.85);

    this.thud(2.25,1); this.tone(41,1.8,'sawtooth',.18,2.25,30,.003,'both'); this.hiss(1.2,.3,'lowpass',1200,60,2.25,.8,.003,'echo'); this.scrape(2.3,2.2,900,180,.09);
    this.k=1; this.ambStart(); setTimeout(()=>this.startHum(),2400); },
  exit(){ if(!this.resume()) return; this.stopHum(); this.ambStop(); this.k=.25;
    this.thud(0,.8); [110,116.5].forEach(f=>this.tone(f,1.3,'sawtooth',.1,0,14,.01,'both'));
    this.hiss(1.4,.22,'bandpass',4200,300,0,1.4,.2,'dist'); this.scrape(.2,1.4,1800,300,.1); this.heartbeat(1.5); this.k=1; },
  startHum(){ if(!this.ctx||this.humNodes) return; const c=this.ctx,t=c.currentTime; const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.035,t+3);

try{ SND.muted=localStorage.getItem('room-muted')==='1'; }catch(e){}
function syncMute(){ const b=$('muteBtn'), off=SND.muted; b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4l5-4.5v15L7.5 15h-4z"/>'+(off?'<path d="M16 9l6 6M22 9l-6 6"/><path d="M2 2l20 20" class="slash"/>':'<path d="M16 9a4.2 4.2 0 0 1 0 6M18.6 6.4a8 8 0 0 1 0 11.2"/>')+'</svg>';

const camera = new THREE.PerspectiveCamera(68, 1, 0.02, 140); scene.add(camera);
var pixScale, introDist;

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)*(typeof pixScale==='number'?pixScale:SITE.pixelScale));
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.fov = w<h ? 82 : 68; camera.updateProjectionMatrix();
  if(typeof introDist==='number'){ const hf=2*Math.atan(Math.tan(camera.fov*Math.PI/360)*camera.aspect); introDist=Math.max(8.2,(4.15+.55)/Math.tan(hf/2)); }
}
addEventListener('resize',resize); resize();

/* textures */
function canvasTex(w,h,draw,rep){ const c=document.createElement('canvas'); c.width=w;c.height=h; draw(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep[0],rep[1]);} t.magFilter=THREE.NearestFilter; return t; }
function grime(x,w,h,n,a){ for(let i=0;i<n;i++){ const r=4+Math.random()*40; const g=x.createRadialGradient(0,0,0,0,0,r); const px=Math.random()*w, py=Math.random()*h; g.addColorStop(0,'rgba(0,0,0,'+a+')'); g.addColorStop(1,'rgba(0,0,0,0)'); x.save(); x.translate(px,py); x.fillStyle=g; x.fillRect(-r,-r,r*2,r*2); x.restore(); } }
const wallTex = canvasTex(256,256,(x,w,h)=>{
  x.fillStyle='#1b1e25'; x.fillRect(0,0,w,h);
  for(let i=0;i<4000;i++){ const v=20+Math.random()*18|0; x.fillStyle='rgb('+v+','+(v+2)+','+(v+6)+')'; x.fillRect(Math.random()*w,Math.random()*h,2,2); }
  x.strokeStyle='#0a0b0e'; x.lineWidth=3; x.strokeRect(2,2,w-4,h-4); x.beginPath(); x.moveTo(0,h/2); x.lineTo(w,h/2); x.stroke();
  x.strokeStyle='#323743'; x.lineWidth=1; x.strokeRect(5,5,w-10,h-10);
  x.fillStyle='#4a515e'; [[12,12],[w-12,12],[12,h-12],[w-12,h-12],[12,h/2+8],[w-12,h/2+8]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],2.5,0,7);x.fill();});
  grime(x,w,h,26,.55);
  for(let i=0;i<7;i++){ const px=Math.random()*w, len=30+Math.random()*120; const g=x.createLinearGradient(0,h/2,0,h/2+len); g.addColorStop(0,'rgba(5,4,3,.55)'); g.addColorStop(1,'rgba(5,4,3,0)'); x.fillStyle=g; x.fillRect(px,h/2,1+Math.random()*3,len); }
},[2,2]);
const floorTex = canvasTex(256,256,(x,w,h)=>{

      tween(750,e=>{ ph.position.lerpVectors(p0,s.objBase.pos,e); ph.quaternion.copy(q0).slerp(q1,e); },()=>{ s.held=false; }); }
    mode='travel'; yaw=yawT=theta(s.i); pitch=pitchT=0;
    setTimeout(()=>moveCam(V(0,EYE,0),dirOf(yaw,0).add(V(0,EYE,0)),1100,()=>{ mode='room'; $('hudBot').classList.remove('hide'); $('openBtn').focus({preventScroll:true}); }),400);
    return; }
  if(s.isMusic){ hideMusic(); s.music.on=false; }
  if(s.video){ s.video.hold=false; s.video.switchT=performance.now(); }
  if(s.book) closeBook(s);
  if(s.audio) audioStop(s);
  if(s.gfx){ hideGfxUi(); s.gfx.stage='off'; s.gfx.hover=-1; setPix(SITE.pixelScale); }
  focused=null; SND.back();
  const p=$('panel'); p.classList.remove('open'); p.setAttribute('aria-hidden','true'); p.inert=true;
  mode='travel'; yaw=yawT=theta(s.i); pitch=pitchT=0;
  moveCam(V(0,EYE,0),dirOf(yaw,0).add(V(0,EYE,0)),1100,()=>{ mode='room'; $('hudBot').classList.remove('hide'); $('openBtn').focus({preventScroll:true}); });
}

function esc(t){ return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fillPanel(sec){
  document.documentElement.style.setProperty('--sec',sec.color);
  $('pJp').textContent=sec.jp; $('pName').textContent=sec.name; $('pBranch').textContent=sec.branch.toUpperCase();
  let html=sec.blurb.split(/\n\s*\n/).map(t=>'<p class="p-blurb"'+(sec.lang?' lang="'+sec.lang+'"':'')+'>'+esc(t)+'</p>').join('');
  if(sec.object==='camera'){ const yp=sec.projects.find(q=>q.youtube); if(yp) html+='<div class="yt-wrap">'+ytEmbed(yp)+'<span class="t-meta">'+esc([yp.title,yp.type,yp.year].filter(Boolean).join(' · '))+'</span></div>'; }
  if(sec.name==='CONTACT'){
    html+='<div class="contact"><div class="mail"><code id="mailAddr">'+esc(SITE.email)+'</code><button class="btn" type="button" id="copyBtn">Copy email</button></div><div class="links">'+SITE.socials.map(s=>'<a class="btn" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.label)+' ↗</a>').join('')+'</div></div>';
  } else if(sec.projects.length){
    html+='<div class="grid">'+sec.projects.map(p=>{ const inner='<div class="thumb">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.title)+'">':'<div class="ph"><span>'+esc(sec.jp.charAt(0))+'</span><span>ADD IMAGE</span></div>')+'</div><span class="t-title">'+esc(p.title)+'</span><span class="t-meta">'+esc((p.type||'')+(p.year?' · '+p.year:''))+'</span>';
      return p.link?'<a class="tile" href="'+esc(p.link)+'" target="_blank" rel="noopener">'+inner+'</a>':'<article class="tile">'+inner+'</article>'; }).join('')+'</div>';
  } else {
    html+='<div class="grid"><article class="tile"><div class="thumb"><div class="ph"><span>'+esc(sec.jp.charAt(0))+'</span><span>ADD PORTRAIT</span></div></div><span class="t-title">Ronelo Lamrini</span><span class="t-meta">Rotterdam · 25 · Creative Business</span></article></div>';
  }
  $('pBody').innerHTML=html; $('pBody').scrollTop=0;
  if(sec.object==='camera'){ const vsec=roomSectors.find(x=>x.video); $('pBody').querySelectorAll('.tile').forEach((el,n)=>{ const pick=()=>{ if(!vsec) return; const R=vsec.video; if(R.idx!==n){ R.idx=n; R.flash=performance.now(); } R.hold=true; R.last=0; }; ['mouseenter','focus','click'].forEach(ev=>el.addEventListener(ev,pick)); }); }
  $('pFoot').textContent='SECTOR_0'+(SITE.sections.indexOf(sec)+1)+' // '+SITE.name+' // ESC TO RETURN';
  const cb=$('copyBtn'); if(cb) cb.addEventListener('click',()=>{ const t=SITE.email;
    const sel=()=>{ const r=document.createRange(); r.selectNodeContents($('mailAddr')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); cb.textContent='Selected · press copy'; };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>{cb.textContent='Copied';},sel); } else sel(); });
}

/* input */
const cv=$('scene'); const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2(); let down=null, hoverS=null, hoverLogo=false, hoverFlag=null;
function setPtr(e){ ptr.x=e.clientX/innerWidth*2-1; ptr.y=-(e.clientY/innerHeight)*2+1; }
function pick(){
  ray.setFromCamera(ptr,camera);
  if(mode==='focus'&&focused&&focused.gfx){ const k=focused.gfx.stage==='wall'?gfxPick():-1; if(k!==focused.gfx.hover&&k>=0) SND.hover(); if(focused.gfx.stage==='wall') focused.gfx.hover=k; cv.classList.toggle('point',k>=0); return; }
  if(mode==='intro'&&(cs==='idle'||cs==='menu')){ const hf=ray.intersectObject(hScreen,false), nf=hf.length&&!staticOn?flagAt(hf[0].uv):null; if(nf!==hoverFlag){ hoverFlag=nf; if(nf&&nf!==LANG) SND.hover(); Object.keys(lFlags).forEach(k=>{ if(k!==LANG) lFlags[k].material.opacity=k===hoverFlag?.7:.35; }); } if(hoverFlag){ hoverLogo=false; cv.classList.add('point'); return; } }
  if(mode==='intro'&&cs==='menu'){ const hs=ray.intersectObject(hScreen,false), k=hs.length?menuHit(hs[0].uv):-1; if(k>=0&&k!==menuSel){ menuSel=k; SND.hover(); syncMenuDom(); } menuHover=k; cv.classList.toggle('point',k>=0); return; }
  if(mode==='intro'&&cs!=='idle'){ hoverLogo=false; cv.classList.remove('point'); return; }
  if(mode==='intro'){ const h=ray.intersectObject(handheld,true); const was=hoverLogo; hoverLogo=h.length>0; if(hoverLogo&&!was) SND.hover(); cv.classList.toggle('point',hoverLogo); return; }
  const prevH=hoverS; hoverS=null; if(mode==='room'){ const h=ray.intersectObjects(pickables,false); if(h.length) hoverS=h[0].object.userData.sector; } if(hoverS&&hoverS!==prevH) SND.hover();
  cv.classList.toggle('point',!!hoverS);
}
cv.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,sx:e.clientX,moved:0}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ setPtr(e);
  if(down){ const dx=e.clientX-down.x, dy=e.clientY-down.y; down.moved+=Math.abs(dx)+Math.abs(dy); down.x=e.clientX; down.y=e.clientY;
    if(mode==='room'&&down.moved>5){ cv.classList.add('drag'); const st=2*Math.PI/N, off=Math.abs(Math.round(yaw/st)*st-yaw), mag=.6+.4*Math.min(1,off/.2); yawT+=dx*.0036*mag; pitchT=Math.max(-.4,Math.min(.45,pitchT+dy*.0027)); } }
  pick(); });
cv.addEventListener('pointerup',e=>{ cv.classList.remove('drag'); const d0=down, click=down&&down.moved<6; down=null;
  if(d0&&mode==='focus'&&focused&&focused.gfx){ if(click){ setPtr(e); const k=gfxPick(); if(k>=0) gfxZoom(focused,k); else if(focused.gfx.stage==='tv') gfxWall(focused); } return; }
  if(d0&&mode==='focus'&&focused&&focused.book){ const dx=e.clientX-d0.sx; if(Math.abs(dx)>40) bookGo(dx<0?1:-1); else if(click) bookGo(e.clientX<innerWidth/2?-1:1); return; }
  if(!click) return; setPtr(e); pick();
  if(mode==='intro'&&hoverFlag){ setLang(hoverFlag); return; }
  if(mode==='intro'&&cs==='idle'&&hoverLogo) pressStart();
  else if(mode==='intro'&&cs==='menu'&&menuHover>=0) menuConfirm(menuHover);
  else if(mode==='room'&&hoverS) openSector(hoverS);
  else if(mode==='focus') closeSector(); });
cv.addEventListener('pointerleave',()=>{ if(!down){ hoverS=null; hoverLogo=false; } });
let wheelAcc=0, wheelLock=0, wheelIdle=null;
cv.addEventListener('wheel',e=>{ if(mode==='focus'&&focused&&focused.book){ e.preventDefault(); const now=performance.now(); if(now<wheelLock) return; const raw=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY, dy=e.deltaMode===1?raw*33:raw; wheelAcc+=dy; clearTimeout(wheelIdle); wheelIdle=setTimeout(()=>{ wheelAcc=0; },500); if(Math.abs(wheelAcc)>=100){ bookGo(wheelAcc>0?1:-1); wheelAcc=0; wheelLock=now+220; } return; }
  if(mode!=='room') return; e.preventDefault(); const now=performance.now(); if(now<wheelLock) return;
  const dy=e.deltaMode===1?e.deltaY*33:e.deltaY; wheelAcc+=dy; clearTimeout(wheelIdle); wheelIdle=setTimeout(()=>{ wheelAcc=0; },650);
  if(Math.abs(wheelAcc)>=190){ const st=2*Math.PI/N; yawT=Math.round(yawT/st)*st+(wheelAcc>0?-st:st); wheelAcc=0; wheelLock=now+380; SND.tick(); } },{passive:false});

$('enterBtn').addEventListener('click',pressStart);
document.querySelectorAll('.lang-dom [data-lang]').forEach(b=>{ b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)); b.addEventListener('click',()=>setLang(b.dataset.lang)); });
const step=2*Math.PI/N;
$('prevBtn').addEventListener('click',()=>{ if(mode==='room'){ SND.tick(); yawT=Math.round(yawT/step)*step+step; } });
$('nextBtn').addEventListener('click',()=>{ if(mode==='room'){ SND.tick(); yawT=Math.round(yawT/step)*step-step; } });
$('openBtn').addEventListener('click',()=>{ if(mode==='room'){ yawT=yaw=Math.round(yaw/step)*step; openSector(sectors[nearest()]); } });
$('closeBtn').addEventListener('click',closeSector);
$('bkPrev').addEventListener('click',()=>bookGo(-1)); $('bkNext').addEventListener('click',()=>bookGo(1)); $('bkClose').addEventListener('click',closeSector); $('gBack').addEventListener('click',closeSector); $('gfxui').inert=true; $('bookui').inert=true;
$('hHang').addEventListener('click',closeSector); $('mClose').addEventListener('click',closeSector); $('musicui').inert=true; $('holo').inert=true;
$('hCopy').addEventListener('click',()=>{ const b=$('hCopy'); const sel=()=>{ const r=document.createRange(); r.selectNodeContents($('hMail')); const g=getSelection(); g.removeAllRanges(); g.addRange(r); b.textContent='Selected, press copy'; };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(SITE.email).then(()=>{ b.textContent='Copied'; SND.hover(); },sel); } else sel(); });
addEventListener('keydown',e=>{
  if(cs==='web'){ if(e.key==='Escape'){ if(!$('osMenu').hidden) wfMenu(false); else { const t=topWin(), W=Object.values(WM.wins).find(x=>x.w===t); if(W) W.w.querySelector('[data-w="close"]').click(); else closeWeb(); } } return; }
  if(e.key==='Escape'&&focused){ closeSector(); return; }
  if(mode==='focus'&&focused&&focused.gfx&&focused.gfx.stage==='tv'){ const n=focused.sec.projects.length, k=focused.gfx.sel; if(e.key==='ArrowRight'){ gfxZoom(focused,(k+1)%n); e.preventDefault(); } if(e.key==='ArrowLeft'){ gfxZoom(focused,(k-1+n)%n); e.preventDefault(); } return; }
  if(mode==='focus'&&focused&&focused.book){ if(e.key==='ArrowRight'||e.key==='PageDown'){ bookGo(1); e.preventDefault(); } if(e.key==='ArrowLeft'||e.key==='PageUp'){ bookGo(-1); e.preventDefault(); } return; }
  if(mode==='intro'&&cs==='idle'&&e.key==='Enter'&&document.activeElement===document.body){ pressStart(); return; }
  if(mode==='intro'&&cs==='menu'){ if(e.key==='ArrowUp'||e.key==='ArrowDown'){ menuSel=1-menuSel; SND.hover(); syncMenuDom(); $(menuSel?'mFree':'mPortfolio').focus({preventScroll:true}); e.preventDefault(); return; } if(e.key==='Enter'&&document.activeElement===document.body){ menuConfirm(menuSel); return; } }
  if(mode!=='room') return;
  if(e.key==='ArrowLeft'){ SND.tick(); yawT=Math.round(yawT/step)*step+step; e.preventDefault(); }
  if(e.key==='ArrowRight'){ SND.tick(); yawT=Math.round(yawT/step)*step-step; e.preventDefault(); }
});

/* loop */
const clock=new THREE.Clock(); let screenT=0, flickerT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(LITE){ if(now-(frame._l||0)<31) return; frame._l=now; }
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  for(let n=tweens.length-1;n>=0;n--){ const tw=tweens[n]; const p=(now-tw.t0)/tw.dur; if(p<0) continue; const e=ease(Math.min(1,p)); tw.fn(e); if(p>=1){ tweens.splice(n,1); tw.done&&tw.done(); } }

  if(mode==='intro'){ camPos.set(0,0,introDist); camLook.set(0,0,0);
    const m=reduce?0:1; handheld.rotation.y+=((ptr.x*.35-.12+Math.sin(t*.4)*.06*m)-handheld.rotation.y)*Math.min(1,dt*3);
    handheld.rotation.x+=((-ptr.y*.2+.08)-handheld.rotation.x)*Math.min(1,dt*3); handheld.position.y=Math.sin(t*.8)*.08*m; }
  if(mode==='room'){ if(!down){ const st=2*Math.PI/N, d=Math.round(yawT/st)*st-yawT; if(Math.abs(d)<.4) yawT+=d*Math.min(1,dt*1.8); }
    yaw+=(yawT-yaw)*Math.min(1,dt*7); pitch+=(pitchT-pitch)*Math.min(1,dt*7); if(!down) pitchT*=.985;
    camPos.set(0,EYE+(reduce?0:Math.sin(t*1.1)*.02),0); camLook.copy(camPos).add(dirOf(yaw,pitch));
    const f=nearest(); if(f!==lastFacing){ lastFacing=f; updateFacing(); } }
  camera.position.copy(camPos); camera.lookAt(camLook); camera.updateMatrixWorld(); if(world==='room') SND.listen(camera);
  if(shake>0){ camera.position.x+=(Math.random()-.5)*.04*shake; camera.position.y+=(Math.random()-.5)*.04*shake; }

  if(world==='console'){
    if(cs==='web') return;
    if(cs==='idle') pressMesh.material.opacity=(t*1.6|0)%2?1:.3;
    logo.rotation.y+=dt*(hoverLogo&&mode==='intro'&&cs==='idle'?2.2:1); logo.rotation.x=Math.sin(t*.7)*.18; logoRing.rotation.z+=dt*.5;
    scr.scan.position.y=1.6-((t*.5)%1)*3.2;
    bumpers.forEach((b,n)=>{ b.material.opacity=.2+Math.sin(t*2+n)*.1+(hoverLogo?.25:0); });
    powerLed.material.color.set((t*.8|0)%2?0x3bff8a:0x1a7a44);
    cDust.rotation.y+=dt*.01; drawGlow(t,dt);
    if(staticOn){ drawStatic(); } else if(cs!=='idle'&&cs!=='spark'){ drawMenu(t); } else { renderer.setRenderTarget(rt); renderer.render(lScene,lCam); renderer.setRenderTarget(null); }
    renderer.render(cScene,camera);
    if((t*4|0)!==frame._c){ frame._c=t*4|0; $('clock').textContent=new Date().toTimeString().slice(0,8)+' · JST+'; }
    return;
  }
  // core
  core.rotation.y+=dt*.35; core.rotation.x=Math.sin(t*.4)*.3; coreCage.rotation.y-=dt*.6;
  // flicker
  flickerT-=dt; if(flickerT<=0){ flickerT=.05+Math.random()*.2; strips.forEach(s=>{ s.material.color.setScalar(Math.random()<.08?.15:.85+Math.random()*.15); }); ceilRing.material.color.setScalar(Math.random()<.05?.25:1); const low=Math.random()<.05; coreLight.intensity=low?.3:1.1; if(low&&mode==='room'&&Math.random()<.25) SND.buzz(); }
  // sectors
  const fNear=nearest(), isNear=s=>focused===s||Math.min(Math.abs(s.i-fNear),N-Math.abs(s.i-fNear))<=1;
  roomSectors.forEach(s=>{ const near=world==='room'&&isNear(s); const target=(hoverS===s||focused===s)?1:0; s.hover+=(target-s.hover)*Math.min(1,dt*8);
    if(s.char){ const C=s.char; C.body.scale.y=1+Math.sin(t*1.7)*.006; const cp=C.fig.worldToLocal(camera.position.clone()); const want=Math.max(-.6,Math.min(.6,Math.atan2(cp.x,cp.z)));
      C.head.rotation.y+=(want-C.head.rotation.y)*Math.min(1,dt*2); C.head.rotation.x=.08+Math.sin(t*.6)*.025; C.head.rotation.z=.16+Math.sin(t*.4)*.02; C.fig.rotation.y=Math.sin(t*.35)*.02; }
    if(s.video&&near) drawMonitor(s,t);
    if(s.book) bookUpdate(s.book,performance.now());
    if(s.gfx&&near) gfxUpdate(s,t);
    if(s.audio&&near) audioUpdate(s,t,dt);
    if(s.music){ if(near) drawLaptop(s,t); const lv=SND.ambLevel(); s.music.woofers.forEach((w,n)=>{ const k=1+lv*(n%2?.25:.1); w.scale.set(k,1,k); }); }
    if(!s.isPhone&&!s.static){ s.obj.rotation.y+=dt*(.5+s.hover*1.5); s.obj.position.y=s.objY+(reduce?0:Math.sin(t*1.3+s.k)*.04)+s.hover*.06; } else if(s.isPhone&&!s.held){ s.obj.position.y=s.objY+(reduce?0:Math.sin(t*1.6)*.03)+s.hover*.05; s.obj.rotation.y=Math.sin(t*.7)*.25; }
    if(s.spinParts) s.spinParts.forEach((h,n)=>{ h.rotation.z+=dt*(n?-.5:1.1); });
    s.light.intensity=(s.lightBase!=null?s.lightBase:(s.char?1.3:2.4))+s.hover*(s.lightHover!=null?s.lightHover:(s.char?.8:1.8)); s.cone.material.opacity=.07+s.hover*.05;
    const P=s.obj.userData.parts;
    if(P.bars) P.bars.forEach((b,n)=>{ const v=.25+Math.abs(Math.sin(t*(2+n*.7)+n))*(.8+s.hover*.5); b.scale.y=v; b.position.y=-.52+v/2; });
    if(P.rec) P.rec.visible=(t*2|0)%2===0; if(P.tip) P.tip.scale.setScalar(1+Math.sin(t*6)*.4);
    if(P.orb) P.orb.position.set(Math.cos(t*2)*.55,Math.sin(t*2)*.35,.15); if(P.cage) P.cage.rotation.x+=dt*.4; });
  screenT+=dt; if(screenT>(LITE?.2:.09)){ screenT=0; roomSectors.forEach(s=>{ if(isNear(s)||!LITE) drawScreen(s,t); }); }
  if(world==='room') skyUpdate(t,dt);
  // dust
  if(!reduce){ const a=dust.geometry.attributes.position; for(let n=0;n<dn;n++){ let y=a.array[n*3+1]+dt*.05; if(y>H) y=0; a.array[n*3+1]=y; } a.needsUpdate=true; }
  // clock
  if((t*4|0)!==frame._c){ frame._c=t*4|0; const d=new Date(); $('clock').textContent=d.toTimeString().slice(0,8)+' · JST+'; }
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();

}
